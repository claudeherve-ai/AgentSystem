name: Verify

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend quality and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
      - name: Compile Python
        run: python -m compileall -q agents agentsystem api enforcement evals guardrails memory routing telemetry tools workflows
      - name: Lint Python
        # The repository has pre-existing style debt. Keep this gate actionable
        # while blocking parser errors and undefined-name classes of defects.
        run: ruff check --select E9,F63,F7,F82 agents agentsystem api enforcement evals guardrails memory routing telemetry tools workflows tests
      - name: Run backend tests with coverage
        env:
          CODE_SANDBOX_AUTO_PULL: "true"
        run: |
          python -m pytest -q \
            --cov=agentsystem --cov=api --cov=agents --cov=tools --cov=workflows \
            --cov-report=term-missing --cov-fail-under=35

  frontend:
    name: Frontend typecheck, test, and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npm run lint
      - name: Test
        run: npm test
      - name: Build
        run: npm run build

  infrastructure:
    name: Bicep build and lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build Bicep templates
        uses: azure/cli@v2
        with:
          inlineScript: |
            az bicep build --file infra/main.bicep
            az bicep build --file infra/resources.bicep

  container:
    name: Build and scan ${{ matrix.service }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: frontend
            dockerfile: frontend/Dockerfile
            context: frontend
          - service: api
            dockerfile: apps/api/Dockerfile
            context: .
          - service: worker
            dockerfile: apps/worker/Dockerfile
            context: .
          - service: operator
            dockerfile: apps/operator/Dockerfile
            context: .
    steps:
      - uses: actions/checkout@v4
      - name: Validate container build
        run: |
          docker build --pull \
            --file "${{ matrix.dockerfile }}" \
            --tag "agentsystem-${{ matrix.service }}:${GITHUB_SHA}" \
            "${{ matrix.context }}"
      - name: Scan image
        uses: aquasecurity/trivy-action@v0.33.1
        with:
          image-ref: agentsystem-${{ matrix.service }}:${{ github.sha }}
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"

  security:
    name: Supply chain and secret checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Review pull-request dependency changes
        if: github.event_name == 'pull_request'
        uses: actions/dependency-review-action@v4
      - name: Detect committed secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Scan repository filesystem
        uses: aquasecurity/trivy-action@v0.33.1
        with:
          scan-type: fs
          scan-ref: .
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
      - name: Generate SPDX SBOM
        uses: anchore/sbom-action@v0
        with:
          path: .
          format: spdx-json
          output-file: sbom.spdx.json
      - name: Upload SBOM
        uses: actions/upload-artifact@v4
        with:
          name: sbom-${{ github.sha }}
          path: sbom.spdx.json
          if-no-files-found: error

  codeql:
    name: CodeQL
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: python,javascript-typescript
          build-mode: none
      - name: Analyze
        uses: github/codeql-action/analyze@v3
