name: agentsystem
metadata:
  template: agentsystem-balanced-production@0.1.0

# Four Azure Container Apps services, provisioned by infra/main.bicep (the
# authoritative IaC source — see .azure/deployment-plan.md). Deliberately no
# `env`, `resources`, `ports`, or `ingress` keys here: those are owned
# entirely by infra/modules/containerApps.bicep for every service, so there
# is exactly one place that defines container configuration. `azd deploy`
# matches each service below to its Container App via the `azd-service-name`
# tag set in Bicep (frontend | api | worker | operator).
services:
  frontend:
    project: ./frontend
    language: js
    host: containerapp
    docker:
      path: ./Dockerfile
      context: .

  api:
    project: .
    language: python
    host: containerapp
    docker:
      path: ./apps/api/Dockerfile
      context: .

  worker:
    project: .
    language: python
    host: containerapp
    docker:
      path: ./apps/worker/Dockerfile
      context: .

  operator:
    project: .
    language: python
    host: containerapp
    docker:
      path: ./apps/operator/Dockerfile
      context: .